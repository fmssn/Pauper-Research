[project]
name = "pauper-research"
version = "0.1.0"
description = "Metagame, matchup and card analysis for MTG Pauper"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pauper-research = "pauper_research.cli:main"

[tool.setuptools]
packages = ["pauper_research"]
