<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Decisions Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Tokens copied from the dashboard, plus two hues for card relations:
   --swap (orange, "instead of") and --with (violet, "goes with"). Win rates keep --good / --bad. */
:root {
  --bg: #ffffff; --sunken: #f4f5f6; --hover: #eef0f2; --ink: #1b2230; --ink-2: #464e5c; --muted: #6a7282;
  --line: #e5e8ed; --line-strong: #cdd2da; --good: #2a78d6; --bad: #e34948; --neutral: #9ba1a9; --focus: #2a78d6;
  --swap: #eb6834; --with: #4a3aa7; --mid: #f0efec;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Source Serif 4", Georgia, serif;
  --mana-W: #f4eed2; --mana-U: #a9cdea; --mana-B: #b7aca3; --mana-R: #ec9f80; --mana-G: #9cc598; --mana-C: #d3d5d9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161e; --sunken: #19202a; --hover: #202833; --ink: #eef1f5; --ink-2: #c1c8d2; --muted: #8b94a3;
    --line: #262e3a; --line-strong: #37414f; --good: #3987e5; --bad: #e66767; --neutral: #6f757e; --focus: #5598e7;
    --swap: #d95926; --with: #9085e9; --mid: #383835; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161e; --sunken: #19202a; --hover: #202833; --ink: #eef1f5; --ink-2: #c1c8d2; --muted: #8b94a3;
  --line: #262e3a; --line-strong: #37414f; --good: #3987e5; --bad: #e66767; --neutral: #6f757e; --focus: #5598e7;
  --swap: #d95926; --with: #9085e9; --mid: #383835; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); margin: 0; font: 15px/1.45 var(--font); padding-bottom: 60px; }
button, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1, h2 { font-family: var(--font-head); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { color: var(--ink-2); font-size: 14px; max-width: 78ch; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; }
.brand { font-family: var(--font-head); font-size: 18px; font-weight: 600; margin-right: auto; }
.brand small { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
select { height: 34px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); padding: 0 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 0 12px; height: 32px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 12px 14px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--ink-2); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .k { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--sunken); font-size: 12px; margin-right: 6px; }
main { padding: 20px 16px; max-width: 1280px; margin: 0 auto; display: grid; gap: 22px; }
section { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.subhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 4px; border-bottom: 1px solid var(--line-strong); }
.subhead h3 { font-size: 16px; }
.hero { display: grid; gap: 6px; }
.hero h1 { font-size: 28px; }
.pitch { border-left: 3px solid var(--line-strong); padding: 4px 0 4px 12px; color: var(--ink-2); max-width: 80ch; }
.pitch b { color: var(--ink); }

/* 60-card anatomy bar */
.anat { display: flex; height: 30px; border-radius: 6px; overflow: hidden; gap: 2px; }
.anat > div { display: grid; place-items: center; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; min-width: 0; }
.anat .core { background: var(--ink-2); color: var(--bg); }
.anat .flex { background: repeating-linear-gradient(45deg, var(--sunken), var(--sunken) 6px, var(--hover) 6px, var(--hover) 12px); color: var(--ink); border: 1px dashed var(--line-strong); }
.legendrow { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--sunken); font-size: 13px; }
.chip b { font-variant-numeric: tabular-nums; }
.chip.var { box-shadow: inset 0 0 0 1px var(--swap); }
.card-n { cursor: default; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }

.grid2 { display: grid; gap: 16px; }
@media (min-width: 1000px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: var(--bg); }
.box h4 { margin: 0; font-size: 15px; font-weight: 600; }

/* slot stacked bars */
.slotbar { display: flex; height: 26px; gap: 2px; }
.slotbar > div { border-radius: 4px; display: flex; align-items: center; padding: 0 6px; font-size: 12px; overflow: hidden; white-space: nowrap; color: #fff; min-width: 3px; }
.slotlegend { display: grid; gap: 4px; font-size: 13px; }
.slotlegend .r { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; }

/* copy distribution mini columns */
.dist { display: inline-grid; grid-template-columns: repeat(5, 9px); gap: 2px; align-items: end; height: 22px; vertical-align: middle; }
.dist > i { display: block; background: var(--ink-2); border-radius: 2px 2px 0 0; min-height: 1px; }
.dist > i.zero { background: var(--line-strong); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-strong); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; }

/* swap rows */
.swaps { display: grid; }
.swap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.swap .a { text-align: right; }
.swap .x { color: var(--swap); font-weight: 600; font-size: 13px; }
.swap .meta { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; }
.venn { display: inline-flex; height: 10px; width: 160px; border-radius: 3px; overflow: hidden; vertical-align: middle; gap: 1px; }
.venn i { display: block; height: 100%; }

/* win bars */
.wr { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.wrbar { position: relative; width: 120px; height: 14px; }
.wrbar .axis { position: absolute; left: 0; right: 0; top: 7px; border-top: 1px solid var(--line); }
.wrbar .mid { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line-strong); }
.wrbar .ci { position: absolute; top: 5px; height: 4px; border-radius: 2px; background: var(--neutral); opacity: .55; }
.wrbar .pt { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--bg); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.tag.clear { background: var(--ink); color: var(--bg); }
.tag.noise { background: var(--sunken); color: var(--muted); }

/* heatmap */
.heat { overflow-x: auto; }
.heat svg text { font: 11px var(--font); fill: var(--ink-2); }

/* tree */
.tree { overflow-x: auto; padding-bottom: 6px; }
.tnode { display: flex; align-items: center; }
.tnode > .kids { display: grid; gap: 8px; padding-left: 26px; position: relative; }
.tnode > .kids::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 22px; border-left: 2px solid var(--line-strong); }
.tnode > .kids > .tnode { position: relative; }
.tnode > .kids > .tnode::before { content: ""; position: absolute; left: -16px; width: 16px; top: 50%; border-top: 2px solid var(--line-strong); }
.nbox { min-width: 190px; max-width: 230px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--bg); cursor: pointer; text-align: left; display: grid; gap: 3px; flex: none; }
.nbox:hover { background: var(--hover); }
.nbox[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 0; }
.nbox .ans { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.nbox .ans.yes { color: var(--with); }
.nbox .ans.no { color: var(--swap); }
.nbox .q { font-weight: 600; font-size: 14px; }
.nbox .s { font-size: 12px; color: var(--muted); }
.nbox .share { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.nbox .share i { display: block; height: 100%; background: var(--ink-2); }
.nbox.leaf { border-style: dashed; }
.decklist { columns: 2 220px; column-gap: 24px; font-size: 14px; }
.decklist div { break-inside: avoid; display: grid; grid-template-columns: 22px 1fr; padding: 1px 0; }
.decklist .plus { color: var(--with); font-weight: 600; }
.decklist .lbl { display: block; font-size: 12px; color: var(--muted); font-weight: 500; padding-top: 6px; }

/* notes */
.prose { max-width: 82ch; display: grid; gap: 12px; }
.prose h2 { font-size: 22px; margin-top: 10px; }
.prose h3 { font-size: 17px; margin-top: 6px; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.verdict { display: grid; gap: 8px; }
@media (min-width: 900px) { .verdict { grid-template-columns: repeat(3, 1fr); } }

main > *, .grid2 > *, section, .box { min-width: 0; }
.box { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 700px) {
  .bar { position: static; }
  .slotlegend .r { grid-template-columns: 14px 1fr auto; }
  .slotlegend .r > .wr, .slotlegend .r > .muted:last-child { grid-column: 2 / -1; }
  .swap .meta { justify-content: flex-start; }
}
.drows { display: grid; }
.drow { display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(200px, 1.3fr) minmax(250px, 1fr); gap: 6px 18px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.dname { display: grid; gap: 1px; }
.dname .muted { font-size: 13px; }
.dmeta { font-size: 13px; color: var(--ink-2); }
@media (max-width: 860px) { .drow { grid-template-columns: minmax(0, 1fr); } }
.opts { display: flex; gap: 3px; min-width: 0; }
.opt { display: grid; gap: 3px; min-width: 0; font-size: 12px; white-space: nowrap; }
.optbar { height: 8px; border-radius: 3px; background: var(--ink-2); }
.configs td { padding: 6px; }
.configs th { padding: 4px 6px; }
.sharecell { display: grid; grid-template-columns: 60px auto; align-items: center; gap: 6px; }
.sharecell i { display: block; height: 8px; border-radius: 3px; background: var(--ink-2); }
.shells { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.shell { border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; background: var(--bg); cursor: pointer; text-align: left; display: grid; gap: 8px; align-content: start; }
.shell:hover { background: var(--hover); }
.shell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -1px; }
.shell .nm { font-weight: 600; font-size: 15px; }
.shell .s { font-size: 13px; color: var(--muted); }
.shell .share { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.shell .share i { display: block; height: 100%; background: var(--ink-2); }
.pathchips { display: flex; flex-wrap: wrap; gap: 4px; }
.pc { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--sunken); }
.pc.yes { box-shadow: inset 0 0 0 1px var(--with); }
.pc.no { box-shadow: inset 0 0 0 1px var(--swap); color: var(--ink-2); }
/* condensed variants */
.wtag { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-left: 6px; }
.wtag.up { color: var(--good); background: color-mix(in oklab, var(--good) 12%, transparent); }
.wtag.down { color: var(--bad); background: color-mix(in oklab, var(--bad) 12%, transparent); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 8px; font-size: 14px; }
.pills button span { color: var(--muted); }
.pills button[aria-checked="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pills button[aria-checked="true"] span { color: inherit; opacity: .75; }
.dlist { columns: 2 340px; column-gap: 32px; }
.dl { break-inside: avoid; display: grid; grid-template-columns: 26px 1fr; column-gap: 6px; padding: 3px 0; font-size: 15px; }
.dl .n { text-align: right; color: var(--ink-2); }
.dl .ann { grid-column: 2; font-size: 12.5px; color: var(--ink-2); }
.dl.dec { border-left: 3px solid var(--with); padding-left: 6px; margin-left: -9px; background: color-mix(in oklab, var(--with) 6%, transparent); border-radius: 0 4px 4px 0; }
.also { font-size: 14px; line-height: 1.9; border-top: 1px solid var(--line); padding-top: 8px; }
.stack { display: flex; height: 26px; gap: 2px; border-radius: 6px; overflow: hidden; }
.stack > div { background: var(--ink-2); color: var(--bg); font-size: 12px; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.buildrows { display: grid; }
.brow { display: grid; grid-template-columns: minmax(150px, 220px) 44px 1fr 44px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
@media (max-width: 700px) { .brow { grid-template-columns: 1fr auto; } .brow .pathchips { grid-column: 1 / -1; } }
.decrows { display: grid; gap: 4px; }
.decrow { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.4fr); gap: 4px 16px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 760px) { .decrow { grid-template-columns: minmax(0, 1fr); } }
.dq { font-size: 14.5px; }
.seg2 { display: flex; height: 24px; gap: 2px; min-width: 0; }
.seg2 > div { border-radius: 4px; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; font-size: 12px; min-width: 4px; }
.seg2 .s0 { background: var(--ink-2); color: var(--bg); }
.seg2 .s1 { background: color-mix(in oklab, var(--ink-2) 55%, var(--bg)); color: var(--ink); }
.seg2 .s2, .seg2 .s3 { background: color-mix(in oklab, var(--ink-2) 30%, var(--bg)); color: var(--ink); }
.seg2 .so { background: var(--sunken); color: var(--muted); }
details.more summary { cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 6px 0; }
table.cmp { width: auto; min-width: 100%; }
table.cmp th, table.cmp td { padding: 5px 10px; }
table.cmp td:first-child { white-space: nowrap; }
.cnum { text-align: center; min-width: 96px; }
.bh { color: var(--ink); font-weight: 600; font-size: 13px; white-space: normal; max-width: 150px; margin: 0 auto; }
td.cnum.more { background: color-mix(in oklab, var(--with) 16%, transparent); }
td.cnum.less { background: color-mix(in oklab, var(--swap) 16%, transparent); }
.sp { font-size: 11.5px; color: var(--muted); }
tr.grp td { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding-top: 14px; border-bottom: 1px solid var(--line-strong); }
.keybox { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); background: var(--sunken); border-radius: 8px; padding: 10px 12px; }
.decblock { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.decblock .dq { font-weight: 600; font-size: 15px; }
.opts3 { display: grid; grid-template-columns: minmax(170px, 1.1fr) 110px 230px minmax(240px, 2fr); column-gap: 14px; font-size: 14px; }
.orow { display: contents; }
.orow > * { padding: 6px 0; border-top: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
.orow:first-child > * { border-top: 0; }
.olabel { flex-direction: column; justify-content: center; align-items: flex-start !important; }
.omu { flex-wrap: wrap; gap: 4px; align-content: center; }
.omu.span2 { grid-row: span 2; border-left: 2px solid var(--line-strong); padding-left: 12px; }
.mcap { width: 100%; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.ohead > * { font-size: 12px; color: var(--muted); font-weight: 500; padding-bottom: 2px; }
.oshare { display: flex; align-items: center; gap: 6px; }
.oshare i { display: block; height: 8px; border-radius: 3px; background: var(--ink-2); }
.mchip { font-size: 12px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; cursor: default; }
.mchip.up { background: color-mix(in oklab, var(--good) 16%, transparent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--good); }
.mchip.down { background: color-mix(in oklab, var(--bad) 14%, transparent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--bad); }
.mchip.faint { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
@media (max-width: 900px) {
  .opts3 { grid-template-columns: minmax(0, 1fr); }
  .orow { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; border-top: 1px solid var(--line); padding: 4px 0; }
  .orow:first-child { border-top: 0; }
  .orow > * { border-top: 0; padding: 2px 0; }
  .orow .owin, .orow .omu { grid-column: 1 / -1; }
  .omu.span2 { grid-row: auto; border-left: 0; padding-left: 0; }
  .ohead { display: none; }
}
.listbtn { margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 6px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.listbtn:hover { background: var(--hover); color: var(--ink); }
.listbtn .chev { display: inline-block; transition: transform .15s ease; }
.listbtn[aria-expanded="true"] { color: var(--ink); }
.listbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .listbtn .chev { transition: none; } }
.bpanel { grid-column: 1 / -1; background: var(--sunken); border-radius: 8px; padding: 12px 14px; margin: 4px 0 10px; }
.bpanel .dl.dec { background: color-mix(in oklab, var(--with) 9%, var(--sunken)); }
.alist { display: grid; gap: 8px; }
.dl .n.slotn { color: var(--muted); font-size: 12px; }
.peek { position: fixed; z-index: 40; pointer-events: none; width: 220px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Deck decisions <small>prototype</small></div>
  <select id="deck" aria-label="Deck"></select>
  <div class="seg" id="board" role="group" aria-label="Board"></div>
  <div class="seg" id="theme" role="group" aria-label="Theme"></div>
</div>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>
<div class="tip" id="tip"></div>
<img class="peek" id="peek" alt="">
<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA;
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElementNS(tag === "svg" || attrs?.svg ? "http://www.w3.org/2000/svg" : "http://www.w3.org/1999/xhtml", tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false || k === "svg") continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}

      h("div", { class: "chips", style: { marginTop: "8px" } }, dec.fixed.map(([c, k]) => h("span", { class: "chip" }, h("b", null, k), cardName(c)))))));
}
function optHead(first) {
  return h("div", { class: "orow ohead" }, h("span", null, first), h("span", null, "Played"), h("span", null, "Win rate"), h("span", null, "Better / worse against"));
}
// One option: label, share of lists, win rate with interval, matchup chips.
function optRow(label, share, win, mu, muMode) {
  // muMode: undefined = own matchups; "span" = one cell for both rows of a yes/no decision; "none" = no cell.
  return h("div", { class: "orow" },
    h("div", { class: "olabel" }, label),
    h("div", { class: "oshare num" }, h("i", { style: { width: Math.max(2, Math.round(share * 64)) + "px" } }), pct(share)),
    h("div", { class: "owin" }, win && win.n ? wrBar(withLevel(win), 0.3, 0.7) : h("span", { class: "muted", style: { fontSize: "12px" } }, "no matches")),

function muChips(mu) {
  if (!mu || !mu.length) return h("span", { class: "muted", style: { fontSize: "12px" } }, "too few matches per opponent");
  return mu.map((e) => {

    const clear = lo > 0 || hi < 0;
    return h("span", { class: "mchip " + (d > 0 ? "up" : "down") + (clear ? "" : " faint"),
      title: opp + ": " + pct(wa) + " in " + na + " matches, other lists " + pct(wb) + " in " + nb + ". Difference " + pts(d) + " (" + state.level + "%: " + pts(lo) + " to " + pts(hi) + ")" + (clear ? "" : ", could be chance") + "." },

// A decision: the question, then one row per option. With `pair` (yes/no), both rows share

function decBlock(q, opts, other, pair) {

    h("div", { class: "opts3" }, opts.map(([label, share, win, mu], i) => optRow(h("span", null, label), share, win, mu, pair ? (i === 0 ? "span" : "none") : undefined)),
      other > 0.02 ? h("div", { class: "orow" }, h("div", { class: "olabel muted" }, "other ways"), h("div", { class: "oshare num muted" }, pct(other)), h("div"), h("div")) : null));

// ---------- Variant 3: builds side by side ----------
function renderV3(m) {
  const b = block(), ls = allShells(b);
  m.append(miniHeader());
  if (!ls.length) { m.append(h("p", { class: "note" }, "Too few lists to analyse.")); return; }
  const lists = ls.map(({ n }) => new Map(n.list));
  const decs = ls.map(({ n }) => n.dec.cards);
  const cards = [...new Set(ls.flatMap(({ n }) => n.list.map((x) => x[0])))];
  const typ = (i, c) => lists[i].get(c) || 0;
  const split = (i, c) => { const v = decs[i][c]; return v && v.opts[0][1] < D.meta.settings.corePlay ? v : null; };
  const differs = [], within = [], same = [];
  for (const c of cards) {
    const ks = ls.map((_, i) => typ(i, c));
    // A build differs when it plays 2+ copies more or fewer than the stock list; smaller gaps are noise.
    const gap = Math.max(...ks.map((k) => Math.abs(k - ks[0])));
    if (gap >= 2) differs.push([c, gap]);
    else if (ls.some((_, i) => split(i, c) && altText(split(i, c), typ(i, c)))) within.push([c, Math.max(...ls.map((_, i) => split(i, c) ? 1 - split(i, c).opts[0][1] : 0))]);
    else same.push([c, ks[0]]);
  }
  differs.sort((a, b2) => b2[1] - a[1]); within.sort((a, b2) => b2[1] - a[1]); same.sort((a, b2) => b2[1] - a[1]);
  const cell = (i, c) => {
    const k = typ(i, c), base = typ(0, c), sp = split(i, c);
    const cls = i > 0 && k > base ? "more" : i > 0 && k < base ? "less" : "";
    return h("td", { class: "cnum " + cls, title: sp ? "In this build: " + sp.opts.map((o) => o[0] + " in " + pct(o[1])).join(", ") : null },
      h("b", { class: "num" }, k || "–"), sp && altText(sp, k) ? h("span", { class: "sp num" }, " " + altText(sp, k)) : null);
  };
  const row = ([c]) => h("tr", null, h("td", null, cardName(c)), ls.map((_, i) => cell(i, c)));
  const groupRow = (label, n) => h("tr", { class: "grp" }, h("td", { colspan: ls.length + 1 }, label, h("span", { class: "muted" }, " · " + n)));
  m.append(h("section", null,
    h("div", { class: "subhead" }, h("h3", null, ls.length > 1 ? "Builds side by side" : "One build"), h("span", { class: "muted", style: { fontSize: "13px" } }, "typical copies per build · “or 3”: a quarter or more of that build's lists play 3")),
    h("div", { class: "tablewrap" }, h("table", { class: "cmp" },
      h("thead", null, h("tr", null, h("th", null),
        ls.map(({ n }) => h("th", { class: "cnum" }, h("div", { class: "bh" }, shortName(n)), h("div", { class: "muted num" }, pct(n.share) + " · " + winPct(n.win)))))),
      h("tbody", null,
        ls.length > 1 && differs.length ? [groupRow("What sets the builds apart", differs.length), differs.map(row)] : null,
        within.length ? [groupRow("Decided within a build", within.length), within.map(row)] : null))),
    h("div", { class: "legendrow" }, h("span", null, h("i", { class: "sw", style: { background: "color-mix(in oklab, var(--with) 30%, transparent)" } }), "more than the stock list"), h("span", null, h("i", { class: "sw", style: { background: "color-mix(in oklab, var(--swap) 30%, transparent)" } }), "fewer"), h("span", { class: "muted" }, "Hover a cell for the full split.")),
    h("details", { class: "more" }, h("summary", null, same.length + " cards the same in every build"),
      h("div", { class: "chips", style: { marginTop: "8px" } }, same.map(([c, k]) => h("span", { class: "chip" }, h("b", null, k), cardName(c)))))));
}
// "or 3": a common alternative (25%+ of the build's lists) to the typical count.
function altText(sp, k) {
  const alt = sp.opts.find((o) => o[0] !== k);
  return alt && alt[1] >= 0.25 ? "or " + (alt[0] || "none") : "";
}

// notes

function renderNotes(m) {
  const s = D.meta.settings;
  m.append(h("div", { class: "prose" },
    h("h1", { style: { fontSize: "30px" } }, "Which cards are real decisions?"),
    h("p", { class: "note" }, "Prototype built on " + D.decks.length + " decks with " + D.meta.days + " days of data (" + D.meta.since + " to " + D.meta.until + ", all events). Pick a deck above. Hover a card name for its image."),
    h("h2", null, "The question, in statistics terms"),
    h("p", null, "Each list of a deck is a vector of copy counts: one number per card. The question “if you take X, you usually don't take Y” is about how these numbers move together across lists, which makes it multivariate statistics. PCA is one tool for it, but it gives abstract axes that mix unrelated cards. Each part of the page uses a tool that gives a direct answer:"),
    h("ul", null,
      h("li", null, h("b", null, "Shells: "), "a divisive tree (as in monothetic clustering). At each step it picks the one card choice (“4+ Moon-Circuit Hacker?”) that best predicts the rest of the list. The leaves are the shells, each with a typical list built by Frank Karsten's aggregate method: the 60 most common (card, nth copy) pairs."),
      h("li", null, h("b", null, "Fixed core: "), "cards in nearly every list with nearly always the same count."),
      h("li", null, h("b", null, "How many copies: "), "cards everyone plays, but in different numbers (“18 or 19 Mountain”)."),
      h("li", null, h("b", null, "Slots: "), "groups of cards whose combined copies vary much less than each card alone, i.e. they replace each other. Shown as the actual splits lists use."),
      h("li", null, h("b", null, "In or out, trade-offs and packages: "), "how often two cards appear together compared with chance (φ coefficient).")),
    h("h3", null, "One trap: every list has 60 cards"),
    h("p", null, "Copy counts are compositional: one more copy of anything means one less of something else. So every card is slightly negatively related to every other card, and naive methods find “swaps” everywhere (the first version of slot detection merged the whole flexible part into one slot). The page guards against it: swaps must be clearly below what chance would give, slots must hold a steady total, basic lands stay out of slots (they trade with everything), and snow-covered basics count as basics."),
    h("p", null, "The shells are greedy: when two questions split the lists almost equally well, a few more lists can swap their order. The shells themselves tend to stay the same."),
    h("h2", null, "Win rates"),

    h("h2", null, "Settings used"),
    h("ul", { class: "num" },
      h("li", null, "Core: in " + pct(s.corePlay) + "+ of lists (as on the dashboard). Flexible: in " + pct(s.flexMinPlay) + "–" + pct(s.corePlay) + ", or core with a varying copy count."),
      h("li", null, "Swap: φ ≤ " + s.swapPhi + ", together in at most " + pct(s.swapMaxBoth) + " of the lists chance would give, and 5+ lists with only one of the two. Only cards in under " + pct(s.corePlay) + " of lists. Package: φ ≥ " + s.withPhi + "."),
      h("li", null, "Copy-count decision: a card in " + pct(s.corePlay) + "+ of lists whose most common count is in under 75% of them. Win rate compares the two most common counts."),
      h("li", null, "Slot: groups merge while Var(A+B) / (Var A + Var B) < " + s.slotRatio + ", at most 5 cards, basics excluded; shown only if " + pct(s.slotSteady) + "+ of lists are within one card of its usual total."),
      h("li", null, "Shells: up to " + s.treeDepth + " questions deep; each side needs " + pct(s.treeMinShare) + "+ of lists, and a question must explain " + pct(s.treeMinGain) + "+ of the remaining spread.")),
    h("h2", null, "Other methods considered"),
    h("ul", null,
      h("li", null, h("b", null, "NMF / topic models (LDA): "), "split each list into additive “packages”. Good for formats with many packages, but they need a chosen number of packages and Pauper decks mostly have 1–3 decisions."),
      h("li", null, h("b", null, "Graphical lasso / Ising model: "), "a network of direct card links that controls for the other cards (it partly removes the 60-card effect). More rigorous than A, but harder to explain; a possible upgrade for A's swap detection."),
      h("li", null, h("b", null, "PCA (tried, dropped): "), "each axis a seesaw of cards, every list on a map. It finds package-against-package trade-offs, but later axes mix unrelated cards and basic land counts creep in."),
      h("li", null, h("b", null, "Hierarchical clustering of lists: "), "finds shells too, but without a reason. The tree gives every split a card that explains it.")),
  ));
}
